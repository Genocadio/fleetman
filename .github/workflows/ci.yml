name: CI

# Validates every push and pull request to main and produces a debug APK
# artifact so build breakage is caught before a release tag is pushed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Flutter 3.50 treats informational lints as fatal by default; this
        # project currently has pre-existing infos from the new SDK.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=NEXXAUTH_CLIENT_ID=ci_placeholder \
            --dart-define=NEXXAUTH_ORIGIN=android://com.example.fleetman

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetman-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
